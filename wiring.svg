<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Soil Robot Car - Wiring Diagram</text>

  <!-- Arduino -->
  <rect x="330" y="60" width="240" height="480" rx="10" fill="#e8f1fb" stroke="#1f4e8c" stroke-width="2"/>
  <text x="450" y="85" text-anchor="middle" font-weight="bold" fill="#1f4e8c">Arduino Uno / Nano</text>

  <!-- Left pins -->
  <g fill="#111">
    <text x="342" y="115">D5</text><text x="342" y="155">D6</text><text x="342" y="195">D7</text>
    <text x="342" y="235">D8</text><text x="342" y="275">D9</text><text x="342" y="315">D10</text>
  </g>
  <!-- Right pins -->
  <g fill="#111" text-anchor="end">
    <text x="558" y="115">D11</text><text x="558" y="165">D12</text><text x="558" y="205">D13</text>
    <text x="558" y="265">D4</text><text x="558" y="305">A0</text>
    <text x="558" y="365">D2</text><text x="558" y="405">A1</text>
  </g>

  <!-- L298N -->
  <rect x="30" y="80" width="200" height="260" rx="8" fill="#fdf1e3" stroke="#b5651d" stroke-width="2"/>
  <text x="130" y="102" text-anchor="middle" font-weight="bold" fill="#b5651d">L298N Motor Driver</text>
  <g fill="#111">
    <text x="45" y="115">ENA (right speed)</text>
    <text x="45" y="155">ENB (left speed)</text>
    <text x="45" y="195">IN1</text>
    <text x="45" y="235">IN2</text>
    <text x="45" y="275">IN3</text>
    <text x="45" y="315">IN4</text>
  </g>
  <g stroke="#b5651d" stroke-width="2">
    <line x1="230" y1="110" x2="330" y2="110"/>
    <line x1="230" y1="150" x2="330" y2="150"/>
    <line x1="230" y1="190" x2="330" y2="190"/>
    <line x1="230" y1="230" x2="330" y2="230"/>
    <line x1="230" y1="270" x2="330" y2="270"/>
    <line x1="230" y1="310" x2="330" y2="310"/>
  </g>

  <!-- Motors and battery -->
  <rect x="30" y="370" width="200" height="40" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.5"/>
  <text x="130" y="395" text-anchor="middle" fill="#111">Right motor: OUT1, OUT2</text>
  <rect x="30" y="420" width="200" height="40" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.5"/>
  <text x="130" y="445" text-anchor="middle" fill="#111">Left motor: OUT3, OUT4</text>
  <rect x="30" y="470" width="200" height="60" rx="6" fill="#fde8e8" stroke="#a02020" stroke-width="1.5"/>
  <text x="130" y="492" text-anchor="middle" fill="#111">Battery 7-12 V</text>
  <text x="130" y="512" text-anchor="middle" fill="#111" font-size="12">(+) to 12V pin, (-) to GND</text>

  <!-- Servo -->
  <rect x="670" y="90" width="200" height="40" rx="6" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="115" text-anchor="middle" fill="#111">Servo SG90 (signal)</text>
  <line x1="570" y1="110" x2="670" y2="110" stroke="#2e7d32" stroke-width="2"/>

  <!-- HC-SR04 -->
  <rect x="670" y="140" width="200" height="80" rx="6" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="157" text-anchor="middle" font-weight="bold" fill="#2e7d32" font-size="13">HC-SR04</text>
  <text x="685" y="175" fill="#111">TRIG</text>
  <text x="685" y="205" fill="#111">ECHO</text>
  <line x1="570" y1="160" x2="670" y2="160" stroke="#2e7d32" stroke-width="2"/>
  <line x1="570" y1="200" x2="670" y2="200" stroke="#2e7d32" stroke-width="2"/>

  <!-- Moisture -->
  <rect x="670" y="240" width="200" height="80" rx="6" fill="#e6f0ff" stroke="#1f4e8c" stroke-width="2"/>
  <text x="770" y="256" text-anchor="middle" font-weight="bold" fill="#1f4e8c" font-size="13">Soil moisture sensor</text>
  <text x="685" y="275" fill="#111">VCC</text>
  <text x="685" y="310" fill="#111">AOUT</text>
  <line x1="570" y1="260" x2="670" y2="260" stroke="#1f4e8c" stroke-width="2"/>
  <line x1="570" y1="300" x2="670" y2="300" stroke="#1f4e8c" stroke-width="2"/>

  <!-- Salinity -->
  <rect x="670" y="340" width="200" height="80" rx="6" fill="#f3e8ff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="770" y="356" text-anchor="middle" font-weight="bold" fill="#6a1b9a" font-size="13">Salinity (EC) sensor</text>
  <text x="685" y="375" fill="#111">VCC</text>
  <text x="685" y="410" fill="#111">AOUT</text>
  <line x1="570" y1="360" x2="670" y2="360" stroke="#6a1b9a" stroke-width="2"/>
  <line x1="570" y1="400" x2="670" y2="400" stroke="#6a1b9a" stroke-width="2"/>

  <!-- Power notes -->
  <rect x="330" y="560" width="540" height="62" rx="6" fill="#fffbe6" stroke="#b59b00" stroke-width="1.5"/>
  <text x="345" y="582" fill="#111" font-size="13">Arduino 5V: HC-SR04 VCC, servo VCC (red wire)</text>
  <text x="345" y="600" fill="#111" font-size="13">Arduino GND: all sensor GND, servo GND (brown wire), HC-SR04 GND</text>
  <text x="345" y="617" fill="#111" font-size="13">Battery GND must be connected to Arduino GND (common ground)</text>
</svg>
